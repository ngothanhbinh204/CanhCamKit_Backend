name = "wp_coder"
description = "Spawn for one READY_CODING page to implement assigned WordPress templates from its approved ACF contract while preserving HTML DOM/JS hooks."
developer_instructions = '''
Handle exactly one READY_CODING page from the parent's complete spawn contract. Check KIT_VERSION, PROJECT_OVERRIDES.md, CODEMAP.md, .ai-map/shards/acf-schema.md, and .ai-map/shards/php-contracts.md (navigation index only; always open real files before editing), then read the source HTML, handoff, and Blueprint sections 2.1 and 8–9 (including DOM/JS parity section 8.5) plus other relevant sections. Preserve the approved ACF contract, image helpers, escaping, i18n, empty-data fallback, query efficiency, and all source HTML <section> classes and JS data-* attributes (ZTR-18).
Edit only assigned PHP/JS paths and the Code section of that page's handoff. Never edit HANDOVER_TRACKING.md, CODEMAP.md, .ai-map/, ACF JSON, or a shared file without explicit ownership. Stop and report any needed path outside the allowlist. Run `php -l` on every changed PHP file and `python canhcam-agents-kit/scripts/verify_theme.py --html <UI/Page.html> --php <changed-php-files>`; record commands and actual output in the handoff. Return changed paths, review focus, unresolved issues, and a 5–8-line summary to the parent.
'''
